name: AMMS UI Forms Validation Migration

on:
  push:
    branches:
      - refactor/forms-validation
    paths:
      - .github/workflows/ui-forms-validation-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/forms-validation
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Apply form migration
        working-directory: frontend
        run: python3 scripts/migrate_forms_validation.py
      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run build
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx frontend/src/components/amms/form-field.tsx frontend/src/components/amms/form-section.tsx frontend/src/components/amms/inter-directorate-request-form.tsx
          git rm .github/workflows/ui-forms-validation-migration.yml frontend/scripts/migrate_forms_validation.py
          git commit -m "refactor: standardize form and validation UX"
          git push origin HEAD:refactor/forms-validation

# Triggered after form-system preparation.
