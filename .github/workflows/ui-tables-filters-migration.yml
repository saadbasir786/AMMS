name: AMMS UI Tables Filters Migration

on:
  push:
    branches:
      - refactor/tables-filters
    paths:
      - .github/workflows/ui-tables-filters-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/tables-filters

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Apply tables and filters codemod
        working-directory: frontend
        run: python3 scripts/migrate_tables_filters.py

      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run build

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx frontend/src/components/amms/request-list-filters.tsx frontend/src/components/amms/meeting-requests-table.tsx
          git rm .github/workflows/ui-tables-filters-migration.yml frontend/scripts/migrate_tables_filters.py
          git commit -m "refactor: standardize request tables and filters"
          git push origin HEAD:refactor/tables-filters

# Triggered after component preparation to keep the migration deterministic.
