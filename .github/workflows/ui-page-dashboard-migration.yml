name: AMMS UI Page Dashboard Migration

on:
  push:
    branches:
      - refactor/page-dashboard
    paths:
      - .github/workflows/ui-page-dashboard-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/page-dashboard

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Apply page/dashboard codemod
        working-directory: frontend
        run: python3 scripts/migrate_page_dashboard.py

      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run build

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx frontend/src/components/amms/page-header.tsx frontend/src/components/amms/metric-card.tsx frontend/src/components/amms/section-card.tsx frontend/src/components/amms/dashboard-overview.tsx
          git rm .github/workflows/ui-page-dashboard-migration.yml frontend/scripts/migrate_page_dashboard.py
          git commit -m "refactor: refresh page chrome and dashboard"
          git push origin HEAD:refactor/page-dashboard

# Triggered after component preparation to keep the migration deterministic.
