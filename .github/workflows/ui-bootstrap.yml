name: AMMS UI Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'refactor/ui-system'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/ui-system

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Tailwind foundation
        working-directory: frontend
        run: |
          pnpm add tailwindcss @tailwindcss/vite
          pnpm add -D @types/node

      - name: Initialize shadcn with RTL
        working-directory: frontend
        run: pnpm dlx shadcn@latest init -t vite -b radix -p nova --rtl --yes --pointer --force

      - name: Add AMMS UI primitives
        working-directory: frontend
        run: >-
          pnpm dlx shadcn@latest add
          direction button alert-dialog dialog alert badge card input textarea select
          checkbox dropdown-menu tooltip skeleton sonner table separator sheet tabs empty spinner
          --yes

      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run build

      - name: Commit generated UI foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "ui: add shadcn component foundation"
          git push origin HEAD:refactor/ui-system
