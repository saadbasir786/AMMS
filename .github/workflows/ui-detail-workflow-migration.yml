name: AMMS UI Detail Workflow Migration

on:
  push:
    branches:
      - refactor/detail-workflow
    paths:
      - .github/workflows/ui-detail-workflow-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/detail-workflow
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Apply detail workflow migration
        working-directory: frontend
        run: python3 scripts/migrate_detail_workflow.py
      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run build
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/flow02.tsx frontend/src/components/amms/detail-summary-card.tsx frontend/src/components/amms/workflow-timeline.tsx frontend/src/components/amms/flow02-detail-view.tsx
          git rm .github/workflows/ui-detail-workflow-migration.yml frontend/scripts/migrate_detail_workflow.py
          git commit -m "refactor: standardize detail workflow UX"
          git push origin HEAD:refactor/detail-workflow

# Trigger active FLOW-02 detail migration.
