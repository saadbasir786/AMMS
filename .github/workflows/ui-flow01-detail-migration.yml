name: AMMS FLOW-01 Detail Migration

on:
  push:
    branches:
      - refactor/detail-flows-01-03
    paths:
      - .github/workflows/ui-flow01-detail-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/detail-flows-01-03
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Apply FLOW-01 detail migration
        working-directory: frontend
        run: python3 scripts/migrate_flow01_detail.py
      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run build
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx frontend/src/components/amms/flow01-detail-view.tsx
          git rm .github/workflows/ui-flow01-detail-migration.yml frontend/scripts/migrate_flow01_detail.py
          git commit -m "refactor: modernize FLOW-01 detail UX"
          git push origin HEAD:refactor/detail-flows-01-03

# Trigger migration after FLOW-03 facade is established.
