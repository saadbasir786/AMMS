name: AMMS UI Shell Migration

on:
  push:
    branches:
      - refactor/application-shell
    paths:
      - .github/workflows/ui-shell-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/application-shell

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Apply shell codemod
        working-directory: frontend
        run: python3 scripts/migrate_application_shell.py

      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run build

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx frontend/src/components/layout/application-shell.tsx
          git rm .github/workflows/ui-shell-migration.yml frontend/scripts/migrate_application_shell.py
          git commit -m "refactor: adopt responsive application shell"
          git push origin HEAD:refactor/application-shell
